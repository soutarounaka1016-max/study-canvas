name: Apply weekly AI cache fix

on:
  push:
    branches: [agent/fix-weekly-recognition-cache]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-recognition-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply cache, model, and verification fixes
        run: node scripts/apply-weekly-ai-cache-fix.mjs
      - name: Commit completed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SafariキャッシュとWorkers AI実動確認を修正"
          git push origin HEAD:agent/fix-weekly-recognition-cache
