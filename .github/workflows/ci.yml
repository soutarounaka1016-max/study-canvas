name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-weekly-ai-fix:
    name: Apply weekly AI fix once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-recognition-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply the one-time fix
        run: node scripts/apply-weekly-ai-cache-fix.mjs
      - name: Restore normal CI and commit the completed fix
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SafariキャッシュとWorkers AI実動確認を修正"
          git push origin HEAD:agent/fix-weekly-recognition-cache

  test:
    name: Unit and build
    needs: apply-weekly-ai-fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log
      - name: Upload unit failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log-${{ github.run_attempt }}
          path: unit-test.log
          if-no-files-found: error
          retention-days: 14
      - run: npm run build

  browser:
    name: Browser checks
    needs: test
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright browsers and dependencies once
        run: npx playwright install --with-deps chromium webkit
      - name: "Run project: chromium"
        run: npm run test:browser -- --project=chromium
      - name: "Run project: webkit"
        run: npm run test:browser -- --project=webkit
      - name: "Run project: ipad-portrait"
        run: npm run test:browser -- --project=ipad-portrait
      - name: "Run project: ipad-landscape"
        run: npm run test:browser -- --project=ipad-landscape
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
