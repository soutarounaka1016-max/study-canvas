name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"Deploying Study Canvas to GitHub Pages\",\"context\":\"study-canvas/pages-deploy\"}"
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'test-results' \
            --exclude 'playwright-report' \
            --exclude '_site' \
            ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"${RUN_URL}\",\"description\":\"Study Canvas deployed to GitHub Pages\",\"context\":\"study-canvas/pages-deploy\"}"
      - name: Record deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"failure\",\"target_url\":\"${RUN_URL}\",\"description\":\"Study Canvas Pages deployment failed\",\"context\":\"study-canvas/pages-deploy\"}"

  verify:
    name: Verify published Study Canvas
    needs: deploy
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Record published-page pending
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"Checking published Study Canvas and Workers AI\",\"context\":\"study-canvas/pages-startup\"}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify Workers AI health
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://study-canvas.soutarou-naka-1016.workers.dev/health"
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --fail --max-time 20 "${health_url}" || true)"
            if node -e '
              try {
                const value = JSON.parse(process.argv[1]);
                const primary = "@cf/moondream/moondream3.1-9B-A2B";
                const fallback = "@cf/mistralai/mistral-small-3.1-24b-instruct";
                const revision = "20260728-ocr-grounding-1";
                const valid = value.ok === true
                  && value.noPaidFallback === true
                  && value.model === primary
                  && value.primaryModel === primary
                  && value.fallbackModel === fallback
                  && value.workerRevision === revision
                  && value.maxRecognitionMs === 32000;
                process.exit(valid ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "${body}"; then
              echo "Workers AI health check succeeded: ${body}"
              exit 0
            fi
            echo "Workers AI is not ready yet (${attempt}/60)."
            sleep 5
          done
          echo "Workers AI health check failed after 5 minutes."
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify published release chain
        env:
          BASE_URL: https://soutarounaka1016-max.github.io/study-canvas/
          EXPECTED_RELEASE: 20260728-ocr-grounding-1
          EXPECTED_ENTRY: release-entry.js?v=20260728-2
          EXPECTED_WEEKLY_ENTRY: weekly-recognition-entry.js?v=20260728-2
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}?release-chain=${GITHUB_SHA}")"
          grep -F "meta name=\"study-canvas-release\" content=\"${EXPECTED_RELEASE}\"" <<<"${html}"
          grep -F "src=\"${EXPECTED_ENTRY}\"" <<<"${html}"
          grep -F "src=\"${EXPECTED_WEEKLY_ENTRY}\"" <<<"${html}"
          entry="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}${EXPECTED_ENTRY}")"
          if grep -F 'weekly-recognition-entry.js' <<<"${entry}"; then
            echo "Weekly recognition must not depend on the serial release entry."
            exit 1
          fi
          weekly="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}${EXPECTED_WEEKLY_ENTRY}")"
          grep -F 'weeklyRunRecognition' <<<"${weekly}"
          grep -F 'weeklySaveCandidates' <<<"${weekly}"
          weekly_ui="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}weekly-ui.js?v=20260728-3")"
          grep -F 'y += 220' <<<"${weekly_ui}"
          for obsolete in '準備中' '次の段階で' '画像は外部へ送信しません' '土台まで実装'; do
            if grep -F "${obsolete}" <<<"${weekly_ui}"; then
              echo "Obsolete weekly AI text remains: ${obsolete}"
              exit 1
            fi
          done
      - name: Verify live Workers AI recognition consecutively
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch({ headless: true });
          const cases = [
            {
              path: "weekly-ai-live-en.png",
              html: `<!doctype html><style>body{margin:0;background:white;font-family:Arial,sans-serif}.sheet{padding:36px;color:#111}.subject{font-size:48px;font-weight:700}.task{margin-top:34px;font-size:64px;font-weight:700}</style><div class="sheet"><div class="subject">MATH WEEKLY PLAN</div><div class="task">INTEGRAL 3 QUESTIONS</div></div>`,
            },
            {
              path: "weekly-ai-live-ja.png",
              html: `<!doctype html><meta charset="utf-8"><style>body{margin:0;background:white;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif}.sheet{padding:36px;color:#111}.subject{font-size:48px;font-weight:700}.task{margin-top:26px;font-size:58px;font-weight:700}</style><div class="sheet"><div class="subject">数学 週間目標</div><div class="task">微積分 3問</div><div class="task">チョイス A</div></div>`,
            },
          ];
          for (const item of cases) {
            const context = await browser.newContext({ viewport: { width: 900, height: 420 } });
            const page = await context.newPage();
            await page.setContent(item.html);
            await page.screenshot({ path: item.path });
            await context.close();
          }
          await browser.close();
          NODE

          recognize_case() {
            local name="$1"
            local expected_regex="$2"
            local expected_model="$3"
            local expected_fallback="$4"
            local max_latency="$5"
            local image_file="weekly-ai-live-${name}.png"
            local response_file="weekly-ai-live-${name}-response.json"
            local error_file="weekly-ai-live-${name}-curl-error.txt"
            local image_data payload http_code curl_exit
            image_data="$(base64 -w0 "${image_file}")"
            payload="$(IMAGE_DATA="${image_data}" node -e 'process.stdout.write(JSON.stringify({mode:"weekly",subject:"数学",weekStart:"2026-07-27",image:{mimeType:"image/png",data:process.env.IMAGE_DATA}}))')"
            : > "${response_file}"
            : > "${error_file}"
            set +e
            http_code="$(curl --silent --show-error --max-time 40 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              -X POST \
              -H 'Origin: https://soutarounaka1016-max.github.io' \
              -H 'Content-Type: application/json' \
              --data-binary "${payload}" \
              'https://study-canvas.soutarou-naka-1016.workers.dev/recognize' \
              2>"${error_file}")"
            curl_exit=$?
            set -e
            echo "${name} curl exit: ${curl_exit}; HTTP status: ${http_code}"
            cat "${error_file}" || true
            cat "${response_file}" || true
            if [ "${curl_exit}" -ne 0 ] || [ "${http_code}" != "200" ]; then
              return 1
            fi
            node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const expectedRegex = process.argv[2];
              const expectedModel = process.argv[3];
              const expectedFallback = process.argv[4];
              const maxLatency = Number(process.argv[5]);
              const titles = Array.isArray(value.tasks) ? value.tasks.map((task) => task?.title || "").join("\n") : "";
              const fallbackValid = expectedFallback === "either"
                || value.fallbackUsed === (expectedFallback === "true");
              const valid = value.subject === "数学"
                && value.weekStart === "2026-07-27"
                && new RegExp(expectedModel).test(value.model)
                && fallbackValid
                && Number.isFinite(value.latencyMs)
                && value.latencyMs >= 0
                && value.latencyMs < maxLatency
                && Array.isArray(value.tasks)
                && value.tasks.length > 0
                && value.tasks.every((task) => typeof task.title === "string" && task.title.trim())
                && new RegExp(expectedRegex, "i").test(titles);
              if (!valid) {
                console.error({ value, titles, expectedRegex, expectedModel, expectedFallback, maxLatency });
                process.exit(1);
              }
              console.log(`Workers AI recognized ${value.tasks.length} task(s) in ${value.latencyMs}ms using ${value.model}.`);
            ' "${response_file}" "${expected_regex}" "${expected_model}" "${expected_fallback}" "${max_latency}"
          }

          recognize_with_retry() {
            local name="$1"
            shift
            for attempt in 1 2 3; do
              if recognize_case "${name}" "$@"; then
                return 0
              fi
              echo "${name} recognition is not ready (${attempt}/3)."
              sleep 10
            done
            return 1
          }

          recognize_with_retry en 'integral|積分' '@cf/moondream/moondream3.1-9B-A2B' false 10000
          recognize_with_retry ja '微積|積分|チョイス|choice|choi' '@cf/mistralai/mistral-small-3.1-24b-instruct|@cf/moondream/moondream3.1-9B-A2B' either 33000
      - name: Verify the published app
        env:
          PLAYWRIGHT_BASE_URL: https://soutarounaka1016-max.github.io/study-canvas/
        run: npm run test:browser -- --project=chromium --grep @published
      - name: Upload Release Gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            weekly-ai-live-en.png
            weekly-ai-live-en-response.json
            weekly-ai-live-ja.png
            weekly-ai-live-ja-response.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record published-page success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"${RUN_URL}\",\"description\":\"Published Study Canvas and Workers AI verified\",\"context\":\"study-canvas/pages-startup\"}"
      - name: Record published-page failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"failure\",\"target_url\":\"${RUN_URL}\",\"description\":\"Published Study Canvas or Workers AI verification failed\",\"context\":\"study-canvas/pages-startup\"}"
      - name: Upload published-page failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pages-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            weekly-ai-live-en.png
            weekly-ai-live-en-response.json
            weekly-ai-live-en-curl-error.txt
            weekly-ai-live-ja.png
            weekly-ai-live-ja-response.json
            weekly-ai-live-ja-curl-error.txt
          if-no-files-found: ignore
          retention-days: 14
