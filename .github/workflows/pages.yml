name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"Deploying Study Canvas to GitHub Pages\",\"context\":\"study-canvas/pages-deploy\"}"
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'test-results' \
            --exclude 'playwright-report' \
            --exclude '_site' \
            ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"${RUN_URL}\",\"description\":\"Study Canvas deployed to GitHub Pages\",\"context\":\"study-canvas/pages-deploy\"}"
      - name: Record deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"failure\",\"target_url\":\"${RUN_URL}\",\"description\":\"Study Canvas Pages deployment failed\",\"context\":\"study-canvas/pages-deploy\"}"

  verify:
    name: Verify published Study Canvas
    needs: deploy
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Record published-page pending
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"Checking published Study Canvas and Workers AI\",\"context\":\"study-canvas/pages-startup\"}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify Workers AI health
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://study-canvas.soutarou-naka-1016.workers.dev/health"
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --fail --max-time 20 "${health_url}" || true)"
            if node -e '
              try {
                const value = JSON.parse(process.argv[1]);
                const valid = value.ok === true
                  && value.noPaidFallback === true
                  && value.model === "@cf/google/gemma-4-26b-a4b-it";
                process.exit(valid ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "${body}"; then
              echo "Workers AI health check succeeded: ${body}"
              exit 0
            fi
            echo "Workers AI is not ready yet (${attempt}/60)."
            sleep 5
          done
          echo "Workers AI health check failed after 5 minutes."
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify published release chain
        env:
          BASE_URL: https://soutarounaka1016-max.github.io/study-canvas/
          EXPECTED_RELEASE: 20260728-weekly-ai-cache-1
          EXPECTED_ENTRY: release-entry.js?v=20260728-1
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}?release-chain=${GITHUB_SHA}")"
          grep -F "meta name=\"study-canvas-release\" content=\"${EXPECTED_RELEASE}\"" <<<"${html}"
          grep -F "src=\"${EXPECTED_ENTRY}\"" <<<"${html}"
          entry="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}${EXPECTED_ENTRY}")"
          grep -F 'weekly-recognition-entry.js?v=20260727-1' <<<"${entry}"
          weekly="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}weekly-recognition-entry.js?v=20260727-1")"
          grep -F 'weeklyRunRecognition' <<<"${weekly}"
          grep -F 'weeklySaveCandidates' <<<"${weekly}"
      - name: Verify live Workers AI recognition
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 900, height: 360 } });
          const page = await context.newPage();
          await page.setContent(`<!doctype html><style>body{margin:0;background:white;font-family:Arial,sans-serif}.sheet{padding:36px;color:#111}.subject{font-size:48px;font-weight:700}.task{margin-top:34px;font-size:64px;font-weight:700}</style><div class="sheet"><div class="subject">MATH WEEKLY PLAN</div><div class="task">INTEGRAL 3 QUESTIONS</div></div>`);
          await page.screenshot({ path: "weekly-ai-live-request.png" });
          await browser.close();
          NODE
          image_data="$(base64 -w0 weekly-ai-live-request.png)"
          payload="$(IMAGE_DATA="${image_data}" node -e 'process.stdout.write(JSON.stringify({mode:"weekly",subject:"数学",weekStart:"2026-07-27",image:{mimeType:"image/png",data:process.env.IMAGE_DATA}}))')"
          http_code="$(curl --silent --show-error --max-time 120 \
            --output weekly-ai-live-response.json \
            --write-out '%{http_code}' \
            -X POST \
            -H 'Origin: https://soutarounaka1016-max.github.io' \
            -H 'Content-Type: application/json' \
            --data-binary "${payload}" \
            'https://study-canvas.soutarou-naka-1016.workers.dev/recognize' || true)"
          echo "Workers AI HTTP status: ${http_code}"
          cat weekly-ai-live-response.json || true
          if [ "${http_code}" != "200" ]; then
            exit 1
          fi
          response="$(cat weekly-ai-live-response.json)"
          node -e '
            const value = JSON.parse(process.argv[1]);
            const valid = value.subject === "数学"
              && value.weekStart === "2026-07-27"
              && Array.isArray(value.tasks)
              && value.tasks.length > 0
              && value.tasks.every((task) => typeof task.title === "string" && task.title.trim());
            if (!valid) { console.error(value); process.exit(1); }
            console.log("Workers AI live recognition succeeded with " + value.tasks.length + " task(s).");
          ' "${response}"
      - name: Verify the published app
        env:
          PLAYWRIGHT_BASE_URL: https://soutarounaka1016-max.github.io/study-canvas/
        run: npm run test:browser -- --project=chromium --grep @published
      - name: Record published-page success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"${RUN_URL}\",\"description\":\"Published Study Canvas and Workers AI verified\",\"context\":\"study-canvas/pages-startup\"}"
      - name: Record published-page failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"failure\",\"target_url\":\"${RUN_URL}\",\"description\":\"Published Study Canvas or Workers AI verification failed\",\"context\":\"study-canvas/pages-startup\"}"
      - name: Upload published-page failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pages-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            weekly-ai-live-request.png
            weekly-ai-live-response.json
          if-no-files-found: ignore
          retention-days: 14
