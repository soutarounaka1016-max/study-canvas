name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  OCR_ARCHIVE_SHA: 70d17413f9bd9832ee2a6e94cb4aaaa2e79d8945

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"Deploying Study Canvas to GitHub Pages\",\"context\":\"study-canvas/pages-deploy\"}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare official site and OCR archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'test-results' \
            --exclude 'playwright-report' \
            --exclude '_site' \
            --exclude 'ai-*' \
            --exclude 'AI_*' \
            --exclude 'cloudflare-worker.js' \
            --exclude 'wrangler.jsonc' \
            --exclude 'weekly-recognition*' \
            --exclude 'weekly-ui.js' \
            --exclude 'taskize*' \
            --exclude 'dashboard*' \
            --exclude 'carryover*' \
            --exclude 'archive-banner.*' \
            --exclude 'src/ai-recognition.js' \
            --exclude 'src/weekly-recognition.js' \
            --exclude 'src/study-stats.js' \
            ./ _site/

          mkdir -p _site/ocr-experiment
          git archive "${OCR_ARCHIVE_SHA}" | tar -x -C _site/ocr-experiment
          rm -rf \
            _site/ocr-experiment/.github \
            _site/ocr-experiment/node_modules \
            _site/ocr-experiment/tests \
            _site/ocr-experiment/test-results \
            _site/ocr-experiment/playwright-report
          find _site/ocr-experiment -type f \( -name '*.js' -o -name '*.html' \) -print0 \
            | xargs -0 sed -i 's/study-canvas:/study-canvas-ocr-archive:/g'
          cp archive-banner.js archive-banner.css _site/ocr-experiment/
          ARCHIVE_HTML="_site/ocr-experiment/index.html" node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = process.env.ARCHIVE_HTML;
          let html = await readFile(path, "utf8");
          html = html
            .replace("</head>", '    <link rel="stylesheet" href="archive-banner.css?v=20260729-1" />\n  </head>')
            .replace("</body>", '    <script src="archive-banner.js?v=20260729-1"></script>\n  </body>');
          await writeFile(path, html);
          NODE
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"${RUN_URL}\",\"description\":\"Study Canvas deployed to GitHub Pages\",\"context\":\"study-canvas/pages-deploy\"}"
      - name: Record deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"failure\",\"target_url\":\"${RUN_URL}\",\"description\":\"Study Canvas Pages deployment failed\",\"context\":\"study-canvas/pages-deploy\"}"

  verify:
    name: Verify published Study Canvas
    needs: deploy
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Record published-page pending
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"Checking official and OCR archive sites\",\"context\":\"study-canvas/pages-startup\"}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify published release chains
        env:
          BASE_URL: https://soutarounaka1016-max.github.io/study-canvas/
          EXPECTED_RELEASE: 20260729-task-card-colors-1
          EXPECTED_ENTRY: release-entry.js?v=20260729-3
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}?release-chain=${GITHUB_SHA}")"
          grep -F "meta name=\"study-canvas-release\" content=\"${EXPECTED_RELEASE}\"" <<<"${html}"
          grep -F "src=\"${EXPECTED_ENTRY}\"" <<<"${html}"
          grep -F 'weekly-text-ui.js?v=20260729-2' <<<"${html}"
          grep -F 'task-ui.js?v=20260729-2' <<<"${html}"
          grep -F 'task-card-colors.css?v=20260729-1' <<<"${html}"
          if grep -E 'weekly-recognition|AIで読み取る|予定時間|学習時間の集計' <<<"${html}"; then
            echo "The official HTML still contains removed OCR or time UI."
            exit 1
          fi
          entry="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}${EXPECTED_ENTRY}")"
          grep -F 'full-backup-entry.js?v=20260729-1' <<<"${entry}"
          if grep -E 'ai-recognition|taskize|dashboard' <<<"${entry}"; then
            echo "The official entry still loads removed AI or time modules."
            exit 1
          fi
          task_ui="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}task-ui.js?v=20260729-2")"
          grep -F 'dailyWeeklyShelf' <<<"${task_ui}"
          grep -F 'sourceWeeklyCardId' <<<"${task_ui}"
          grep -F 'card.dataset.subject = task.subject' <<<"${task_ui}"
          task_colors="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}task-card-colors.css?v=20260729-1")"
          grep -F 'data-subject="数学"' <<<"${task_colors}"
          grep -F 'data-subject="英語"' <<<"${task_colors}"
          grep -F 'data-subject="化学"' <<<"${task_colors}"
          grep -F 'data-subject="物理"' <<<"${task_colors}"

          archive_html="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}ocr-experiment/?archive=${GITHUB_SHA}")"
          grep -F 'meta name="study-canvas-release" content="20260728-ocr-grounding-1"' <<<"${archive_html}"
          grep -F 'archive-banner.js?v=20260729-1' <<<"${archive_html}"
          archive_store="$(curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "${BASE_URL}ocr-experiment/src/task-store.js?v=20260720-7")"
          grep -F 'study-canvas-ocr-archive:tasks:v1' <<<"${archive_store}"
      - name: Verify the published app and OCR archive
        env:
          PLAYWRIGHT_BASE_URL: https://soutarounaka1016-max.github.io/study-canvas/
        run: npm run test:browser -- --project=chromium --grep @published
      - name: Upload Release Gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Record published-page success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"${RUN_URL}\",\"description\":\"Official Study Canvas and OCR archive verified\",\"context\":\"study-canvas/pages-startup\"}"
      - name: Record published-page failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "{\"state\":\"failure\",\"target_url\":\"${RUN_URL}\",\"description\":\"Published verification failed\",\"context\":\"study-canvas/pages-startup\"}"
