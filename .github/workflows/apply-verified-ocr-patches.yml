name: Apply verified OCR patches

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update live OCR verification and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pages.yml')
          text = path.read_text()

          replacements = [
              (
                  '''          recognize_case() {
            local name="$1"
            local expected_regex="$2"
            local image_file="weekly-ai-live-${name}.png"''',
                  '''          recognize_case() {
            local name="$1"
            local expected_regex="$2"
            local expected_model="$3"
            local expected_fallback="$4"
            local max_latency="$5"
            local image_file="weekly-ai-live-${name}.png"''',
              ),
              (
                  '''              const expectedRegex = process.argv[2];
              const titles = Array.isArray(value.tasks) ? value.tasks.map((task) => task?.title || "").join("\\n") : "";
              const valid = value.subject === "数学"
                && value.weekStart === "2026-07-27"
                && value.model === "@cf/moondream/moondream3.1-9B-A2B"
                && value.fallbackUsed === false
                && Number.isFinite(value.latencyMs)
                && value.latencyMs >= 0
                && value.latencyMs < 10000''',
                  '''              const expectedRegex = process.argv[2];
              const expectedModel = process.argv[3];
              const expectedFallback = process.argv[4] === "true";
              const maxLatency = Number(process.argv[5]);
              const titles = Array.isArray(value.tasks) ? value.tasks.map((task) => task?.title || "").join("\\n") : "";
              const valid = value.subject === "数学"
                && value.weekStart === "2026-07-27"
                && value.model === expectedModel
                && value.fallbackUsed === expectedFallback
                && Number.isFinite(value.latencyMs)
                && value.latencyMs >= 0
                && value.latencyMs < maxLatency''',
              ),
              (
                  '''              console.log(`Workers AI recognized ${value.tasks.length} task(s) in ${value.latencyMs}ms using the primary model.`);
            ' "${response_file}" "${expected_regex}"
          }

          recognize_case en 'integral|積分'
          recognize_case ja '微積|積分|チョイス|choice' ''',
                  '''              console.log(`Workers AI recognized ${value.tasks.length} task(s) in ${value.latencyMs}ms using ${value.model}.`);
            ' "${response_file}" "${expected_regex}" "${expected_model}" "${expected_fallback}" "${max_latency}"
          }

          recognize_case en 'integral|積分' '@cf/moondream/moondream3.1-9B-A2B' false 10000
          recognize_case ja '微積|積分|チョイス|choice' '@cf/google/gemma-4-26b-a4b-it' true 18000''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('pages.yml patch target changed')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          rm -rf .automation
          rm -f \
            .automation-trigger \
            .github/workflows/apply-japanese-refinement.yml \
            .github/workflows/run-japanese-refinement.yml \
            .github/workflows/apply-verified-ocr-patches.yml
          node --check cloudflare-worker.js
          npm ci --ignore-scripts
          npm test
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "本番日本語OCR検証をGemma補正経路へ更新"
          git push origin HEAD:${{ github.head_ref }}
